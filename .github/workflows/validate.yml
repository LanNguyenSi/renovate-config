name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate the preset
        # Pinned validator version; bump deliberately.
        run: npx --yes --package renovate@44.167.5 -- renovate-config-validator --strict --no-global default.json
